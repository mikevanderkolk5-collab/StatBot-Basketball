<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StatBot</title>
<style>
:root{--bg:#e8ecef;--panel:#f7f9fa;--ink:#12202f;--mute:#5b6b7b;--line:#bcc6cf;--away:#a8322a;--home:#1f4e8c;--on:#fff;--warn:#c0392b;--ok:#1d7a4f;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--panel:#18222d;--ink:#e6edf3;--mute:#93a3b3;--line:#2c3a48;--away:#e0675d;--home:#6ea3e6;--on:#0f1720;--warn:#ff7b6b;--ok:#4cc38a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1720;--panel:#18222d;--ink:#e6edf3;--mute:#93a3b3;--line:#2c3a48;--away:#e0675d;--home:#6ea3e6;--on:#0f1720;--warn:#ff7b6b;--ok:#4cc38a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#f7f9fa;z-index:20}
h1,h2,.num,.big{font-family:"Arial Narrow","Roboto Condensed","Arial Narrow",Arial,sans-serif;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:.55rem .8rem;min-height:44px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--home);outline-offset:1px}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
.score{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#f7f9fa;color:#000;border-bottom:2px solid var(--line);display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:stretch;gap:0;padding:0}
.score .t{display:flex;align-items:center;gap:10px;padding:8px 14px}
.score .o{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right;gap:2px;padding:8px 14px;min-width:0;overflow:hidden}
.score .o.r{align-items:flex-start;text-align:left}
.score .o .nm{justify-content:flex-end}.score .o.r .nm{justify-content:flex-start}
.score .o .nm{display:flex;align-items:center;font-size:1.15rem;font-weight:700;opacity:1;flex:none;flex-wrap:wrap;max-width:100%;gap:4px}
.score .o .ld{flex:none}
.score .tf{margin:0 6px;font-size:.8rem;font-weight:700;border:1.5px solid currentColor;border-radius:999px;padding:0 8px;line-height:1.5;white-space:nowrap}
.score .tf.bonus{background:var(--warn);color:#fff;border-color:var(--warn)}
.score .o .ld{font-size:.8rem;opacity:.9;line-height:1.2}
.score .sc{display:flex;align-items:center;justify-content:center;padding:8px 18px}
@media (max-width:640px){.score .big{font-size:2.4rem}.score .o{padding:6px 8px}.score .sc{padding:6px 8px}.score .o .nm{font-size:.95rem;gap:3px;flex-direction:column;align-items:flex-end}.score .o.r .nm{align-items:flex-start}.score .tn{order:-1}.score .o .tlogo{height:1.6rem!important}.score .tf{margin:0 2px;padding:0 5px;font-size:.7rem}.score .o .ld{font-size:.68rem}.mid input{font-size:1.5rem}}
.tlogo{vertical-align:middle;object-fit:contain;max-width:4em;margin-right:6px}
.score .tlogo{margin:0}
.score .t.h{justify-content:flex-end}
.score .big{font-size:3.2rem;font-weight:700;line-height:1}
.score .nm{font-size:1.05rem;font-weight:600;opacity:.9}
.mid{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mid input{width:6.2ch;text-align:center;font:700 2rem "Arial Narrow","Roboto Condensed",Arial,sans-serif;background:transparent;border:1px solid #00000055;color:inherit;border-radius:6px;padding:0}
.mid select.per{text-align:center;text-align-last:center;min-width:9.5em;font:600 .95rem system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:transparent;color:#000;border:1px solid #00000055;border-radius:6px;padding:2px 4px;margin-top:2px;min-height:32px}
.mid select.per option{color:#000;background:#fff}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.panel h2{font-size:1.5rem;display:flex;justify-content:space-between;align-items:baseline}
.away h2{color:var(--away)}.home h2{color:var(--home)}
.sub{color:var(--mute);font-size:.9rem;margin:6px 0 4px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.chip{text-align:left;padding:6px 8px;line-height:1.15;border-width:2px}
.chip .num{font-size:1.7rem;font-weight:700;display:block}
.chip small{color:var(--mute);display:block}
.chips.court{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.chips.bench{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.chip{min-width:0;min-height:0;padding:4px 5px;border-width:2px;overflow:hidden}
.chip .num{font-size:1.35rem}
.chip .nm{display:block;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{font-size:.66rem;line-height:1.15}
.chip.b{padding:2px 3px;border-width:1px}
.chip.b .num{font-size:.85rem}
.chip.b .nm{font-size:.5rem}
.chip.b small{font-size:.45rem}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip[aria-pressed=true] small{color:inherit}
.chip.out{border-color:var(--warn)}
.chip.out .num{color:var(--warn)}
.bonus{font-size:.9rem;color:var(--mute)}
.bonus b{color:var(--warn)}
.pad{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:12px;box-shadow:0 -2px 0 var(--bg)}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px;margin-top:6px}
.btns .m{background:var(--ok);color:#fff;border-color:var(--ok)}
.btns .x{border-color:var(--warn);color:var(--warn)}
.log{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.log .feed{margin-top:6px;max-height:140px;overflow-y:auto;overflow-x:hidden}
.log .pl{padding:4px 0;border-top:1px solid var(--line);font-size:.95rem;line-height:1.35}
.log .pl.bad{background:color-mix(in srgb,var(--warn) 14%,transparent);border-left:4px solid var(--warn);padding-left:8px}
.log li{padding:4px 0;border-top:1px solid var(--line);font-size:.95rem}
.log .c{color:var(--mute);margin-right:8px;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;background:var(--panel)}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
th{font-weight:600;color:var(--mute);font-size:.9rem}
tfoot td{font-weight:600}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.setup label{display:block;font-weight:600;margin:8px 0 4px}
.setup input[type=text],.setup textarea,.setup select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.setup textarea{min-height:230px}
.setup .row input[type=text],.setup .row select,.row>select[aria-label^="Choose"]{width:auto}
.note{color:var(--mute);font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.panel.away.active{border-color:var(--away);box-shadow:0 0 0 2px var(--away)}
.panel.home.active{border-color:var(--home);box-shadow:0 0 0 2px var(--home)}
.tt th,.tt td{text-align:right}.tt th:first-child,.tt td:first-child{text-align:left}
.tt .sec td{font-weight:600;color:var(--mute);background:var(--bg);text-align:left}
.log.bad,.log li.bad,.row.bad{background:color-mix(in srgb,var(--warn) 14%,transparent);border-left:4px solid var(--warn);padding-left:8px}
.why{color:var(--warn);font-weight:600;margin-left:8px}
.warnbtn{border-color:var(--warn);color:var(--warn);min-height:36px;padding:.2rem .6rem}
.chip.ph{border-style:dashed;border-color:var(--warn)}
.setup input[type=date],.setup input[type=time]{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.lvl{text-align:left;min-height:130px;padding:16px;cursor:pointer;font:inherit}.lvl:hover{border-color:var(--ink)}
.cmdbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cmd{width:11ch;font:700 1.5rem "Arial Narrow","Roboto Condensed",Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border:2px solid var(--ink);border-radius:6px;background:var(--bg)}
.hint{color:var(--mute);font-size:.9rem;flex:1;min-width:180px}.hint.bad{color:var(--warn)}
.fk{display:flex;gap:6px;flex-wrap:wrap}.fk button{min-height:36px;padding:.2rem .6rem;font-size:.9rem}
details.keys{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
details.keys p{margin:.5rem 0;font-size:.92rem}
@media (max-width:560px){.score .big{font-size:2.4rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.fchip{display:inline-block;margin:4px 6px 0 0;padding:3px 8px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}.fchip.hi{background:#f6c85f;color:#000;border-color:#c99a1b}.fchip.out{background:var(--warn);color:#fff;border-color:var(--warn)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 8px;font-size:.95rem}.crumbs button{min-height:36px;padding:.25rem .7rem}.crumbs button:disabled{opacity:.45;cursor:default}.crumbs .sep{color:var(--mute)}.crumbs .cur{font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script>
const LEVELS=['Boys Varsity','Girls Varsity','Boys JV','Girls JV'],LSUF=['current','games','teams','sched','parked'];
let LV=null,KEY='',GK='',TK='',SK='',PK='',IK='';
const lvKey=(n,s)=>'hoops:'+n.toLowerCase().replace(/[^a-z0-9]+/g,'-')+':'+s;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let STORE_OK=true;const MEM={};
try{localStorage.setItem('hoops:t','1');localStorage.removeItem('hoops:t')}catch(e){STORE_OK=false}
let IMP=null;
const rd=k=>{try{const v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}return k in MEM?JSON.parse(MEM[k]):null};
const wr=(k,v)=>{const j=JSON.stringify(v);MEM[k]=j;try{localStorage.setItem(k,j)}catch(e){}};
const storeWarn=()=>STORE_OK?'':'<div class="wrap" style="padding-bottom:0"><p class="note" role="alert" style="color:var(--warn)"><b>This browser is blocking saved data.</b> The app works, but teams, schedules and games will be lost when you close this page. Try opening the file in Chrome, Edge or Firefox.</p></div>';
let S=null,tab='games',DL=null,last=0,seasonTeam='',setupErr='';
DL={save:async({filename,data})=>{
 const type=/\.html$/.test(filename)?'text/html':'text/csv';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([type==='text/csv'?'\ufeff':'',data],{type:type+';charset=utf-8'}));a.download=filename;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}};
try{if(window.claude)claude.use('downloads').then(d=>{if(d)DL=d}).catch(()=>{})}catch(e){}
const L={m2:'made a 2-pt shot',x2:'missed a 2-pt shot',m3:'made a 3-pt shot',x3:'missed a 3-pt shot',ft:'made a free throw',fx:'missed a free throw',or:'offensive rebound',dr:'defensive rebound',as:'assist',st:'steal',bl:'block',to:'turnover',pf:'foul',wb:'wrong basket, 2 points',db:'deadball rebound',ot:'timeout'};
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const perFull=p=>p<=4?'Quarter '+p:(p===5?'Overtime':'Overtime '+(p-4));
const perLabel=p=>p<=4?'Q'+p:(p===5?'OT':'OT'+(p-4));
const persist=()=>{if(LV&&S){wr(KEY,S);pushLive();autoSave()}};

const legacyHas=()=>LSUF.some(x=>rd('hoops:'+x)!=null);
function moveLegacy(n){
 LSUF.forEach(x=>{const v=rd('hoops:'+x);if(v!=null){wr(lvKey(n,x),v);try{localStorage.removeItem('hoops:'+x)}catch(e){}delete MEM['hoops:'+x]}});
 render();
}
function setLevel(n){
 LV=n;KEY=lvKey(n,'current');GK=lvKey(n,'games');TK=lvKey(n,'teams');SK=lvKey(n,'sched');PK=lvKey(n,'parked');IK=lvKey(n,'imports');IMP=null;
 S=rd(KEY);if(S){S.running=false;S.panel=null}
 tab=S?'game':'games';SD=[{},{}];SPLEN='8';setupNote='';setupErr='';setupSched=null;setupDate=null;LU=null;schedDraft={};GIMP=null;schMsg='';schedMsg='';delAsk={};seasonTeam='';CMD='';EDIT=null;
 render();window.scrollTo(0,0);
}
function switchLevel(){
 if(S){S.running=false;S.panel=null;persist()}
 S=null;LV=null;tab='games';render();window.scrollTo(0,0);
}
function levelView(){
 const card=n=>{
  const g=rd(lvKey(n,'games')),p=rd(lvKey(n,'parked')),sc=rd(lvKey(n,'sched')),cur=rd(lvKey(n,'current'));
  const ng=Array.isArray(g)?g.length:0,np=Array.isArray(p)?p.length:0,ns=Array.isArray(sc)?sc.length:0;
  const lines=[ng+' finished game'+(ng===1?'':'s')];
  if(cur&&cur.teams)lines.push('Game in progress: '+cur.teams[0].name+' vs '+cur.teams[1].name);
  if(np)lines.push(np+' saved game'+(np===1?'':'s')+' to resume');
  if(ns)lines.push(ns+' scheduled');
  return `<button class="panel lvl" onclick="setLevel('${n}')"><span class="big" style="font-size:2rem;display:block">${esc(n)}</span><span class="note" style="display:block;margin:6px 0">${lines.map(esc).join('<br>')}</span><b style="color:var(--${n.startsWith('Boys')?'home':'away'})">Open ›</b></button>`};
 const build=`<div class="row" style="margin-top:16px"><button class="primary" onclick="TB.lv=TB.lv||[];tab='teams';render()">Build a team</button><span class="note">Create a team and assign it to a season.</span></div>`;
 const mig=legacyHas()?`<div class="panel" style="margin-top:16px"><b>Found games and teams saved before team levels existed.</b><p class="note">Move them into one team. They are removed from the old spot and kept only in the team you pick.</p><div class="row">${LEVELS.map(n=>`<button onclick="moveLegacy('${n}')">Move into ${esc(n)}</button>`).join('')}</div></div>`:'';
 return storeWarn()+`<div class="wrap"><h1 style="font-size:2.2rem">Courtside Stats</h1><p class="note">Choose a team. Each one keeps its own games, saved teams, schedule and season totals.</p><div class="setup lvls">${LEVELS.map(card).join('')}</div>${build}${mig}</div>`;
}
const DEF_BG='#f7f9fa',DEF_FG='#000000',HEX=/^#[0-9a-f]{6}$/i;
const brandOf=name=>getTeams().find(x=>x.id===String(name).trim().toLowerCase())||{};
const tLogo=(T,h)=>T&&T.logo&&/^data:image\//.test(T.logo)?`<img class="tlogo" src="${esc(T.logo)}" alt="" style="height:${h||'1.3em'}">`:'';
const tName=T=>esc(T.name)+(T.nick?' '+esc(T.nick):'');
const tBg=T=>HEX.test(T&&T.bg||'')?T.bg:DEF_BG,tFg=T=>HEX.test(T&&T.fg||'')?T.fg:DEF_FG;
const lum=h=>{const n=parseInt(h.slice(1),16),c=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
/* Team builder: create a team and assign it to one or more seasons */
let TB={id:'',origin:'',name:'',ro:'',nick:'',logo:'',bg:DEF_BG,fg:DEF_FG,lv:[],msg:'',ask:''};
const lvTeams=n=>{const v=rd(lvKey(n,'teams'));return Array.isArray(v)?v:[]};
const rosterLines=r=>String(r||'').split('\n').filter(x=>x.trim()).length;
function snapTB(){
 const g=id=>document.getElementById(id);if(!g('tbn'))return;
 TB.name=g('tbn').value;TB.ro=g('tbr').value;TB.nick=g('tbk').value;TB.bg=g('tbb').value;TB.fg=g('tbf').value;TB.lv=LEVELS.filter((n,i)=>g('tbl'+i).checked);
}
function tbPreview(){
 const t=TB,ok=HEX.test(t.bg)&&HEX.test(t.fg),low=ok&&contrast(t.bg,t.fg)<3;
 return `<div id="tbp"><div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:${esc(tBg(t))};color:${esc(tFg(t))}"><span style="font:700 2.4rem 'Arial Narrow',Arial,sans-serif">42</span><span style="font-size:1.05rem;font-weight:600;display:flex;align-items:center;gap:8px">${tLogo(t,'2em')}${esc(t.name||'Team name')} ${esc(t.nick||'')}</span></div>${low?'<p class="note" style="color:var(--warn);margin:4px 0 0">These two colors are hard to tell apart. Pick a lighter or darker text color so the score is easy to read.</p>':''}</div>`;
}
function tbPrev(){snapTB();const e=document.getElementById('tbp');if(e)e.outerHTML=tbPreview()}
function tbLogo(el){
 const f=el.files&&el.files[0];if(!f)return;snapTB();
 if(!/^image\//.test(f.type)){TB.msg='Choose an image file (PNG, JPG, SVG or GIF).';render();return}
 const url=URL.createObjectURL(f),img=new Image();
 img.onload=()=>{const W=img.naturalWidth||150,H=img.naturalHeight||150,sc=Math.min(1,160/Math.max(W,H)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(W*sc));c.height=Math.max(1,Math.round(H*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  TB.logo=c.toDataURL('image/png');TB.msg='';URL.revokeObjectURL(url);render()};
 img.onerror=()=>{URL.revokeObjectURL(url);TB.msg='That image could not be read. Try a PNG or JPG.';render()};
 img.src=url;
}
function tbLogoClear(){snapTB();TB.logo='';render()}
function tbColorReset(){snapTB();TB.bg=DEF_BG;TB.fg=DEF_FG;render()}
function newTB(){TB={id:'',origin:'',name:'',ro:'',nick:'',logo:'',bg:DEF_BG,fg:DEF_FG,lv:LV?[LV]:[],msg:'',ask:''};render()}
function saveTB(){
 snapTB();const name=TB.name.trim(),pl=parseRoster(TB.ro);
 if(!name||!pl.length){TB.msg='Enter a team name and at least one player (like “23 Jordan Smith”).';render();return}
 if(!TB.lv.length){TB.msg='Choose at least one season to assign this team to.';render();return}
 const id=name.toLowerCase(),roster=pl.map(p=>p.n+' '+p.name).join('\n');
 LEVELS.forEach(n=>{
  const old=n===TB.origin?TB.id:null;
  let list=lvTeams(n);
  if(TB.lv.includes(n)){
   list=list.filter(x=>x.id!==id&&x.id!==old);list.push({id,name,roster,nick:TB.nick.trim(),logo:TB.logo||'',bg:TB.bg,fg:TB.fg});
   list.sort((a,b)=>a.name.localeCompare(b.name));wr(lvKey(n,'teams'),list);
  }else if(old){wr(lvKey(n,'teams'),list.filter(x=>x.id!==old))}
 });
 const w=TB.lv.join(', ');
 TB={id:'',origin:'',name:'',ro:'',nick:'',logo:'',bg:DEF_BG,fg:DEF_FG,lv:LV?[LV]:[],msg:'Saved '+name+' ('+pl.length+' players) to '+w+'.',ask:''};render();
}
function editTB(n,id){
 snapTB();const x=lvTeams(n).find(y=>y.id===id);if(!x)return;
 TB={id:x.id,origin:n,name:x.name,ro:x.roster,nick:x.nick||'',logo:x.logo||'',bg:tBg(x),fg:tFg(x),lv:[n],msg:'Editing '+x.name+' in '+n+'. Tick more seasons to copy it there, or untick '+n+' to move it.',ask:''};
 render();window.scrollTo(0,0);
}
function delTB(n,id){
 snapTB();const k=n+'|'+id;
 if(TB.ask!==k){TB.ask=k;render();return}
 wr(lvKey(n,'teams'),lvTeams(n).filter(x=>x.id!==id));TB.ask='';TB.msg='Deleted the team from '+n+'.';
 if(TB.origin===n&&TB.id===id)TB={id:'',origin:'',name:'',ro:'',nick:'',logo:'',bg:DEF_BG,fg:DEF_FG,lv:LV?[LV]:[],msg:TB.msg,ask:''};
 render();
}
function teamsPage(){
 const t=TB,editing=!!t.id;
 const boxes=LEVELS.map((n,i)=>`<label style="display:inline-flex;gap:6px;align-items:center;font-weight:600;margin:4px 16px 4px 0"><input type="checkbox" id="tbl${i}"${t.lv.includes(n)?' checked':''}> ${esc(n)}</label>`).join('');
 const lists=LEVELS.map(n=>{const L=lvTeams(n);

function parseCsv(text){

 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;
  else if(c===','){row.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[]}
  else f+=c}

}
const IALIAS={n:['#','no','no.','num','number','jersey'],name:['player','name','playername'],team:['team','teamname'],gp:['gp','g','games','gamesplayed'],mp:['min','mp','minutes'],pts:['pts','points','tp'],fgm:['fgm','fgmade'],fga:['fga','fgatt','fgattempts'],tpm:['3pm','3ptm','3pmade','tpm','fg3m'],tpa:['3pa','3pta','3patt','tpa','fg3a'],ftm:['ftm','ftmade'],fta:['fta','ftatt','ftattempts'],reb:['reb','rebs','trb','rebounds','totreb'],oreb:['oreb','or','offreb'],dreb:['dreb','dr','defreb'],as:['ast','as','assists'],st:['stl','st','steals'],bl:['blk','bl','blocks'],to:['to','tov','turnovers'],pf:['pf','fouls'],pm:['pm','+/-','plusminus'],fg:['fg'],tp:['3p','3pt','3fg'],ft:['ft']};
function importParse(text,file){

 const head=rows[0].map(h=>h.trim().toLowerCase().replace(/\s+/g,'')),col={};
 Object.keys(IALIAS).forEach(k=>{const i=head.findIndex(h=>IALIAS[k].includes(h));if(i>=0)col[k]=i});
 if(col.name==null)return{err:'Could not find a Player column. The header row needs a column named Player (or Name).'};
 const num=v=>{const x=Number(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isFinite(x)?x:0};
 const mins=v=>{v=String(v==null?'':v).trim();const m=v.match(/^(\d+):(\d{2})$/);return m?(+m[1])+(+m[2])/60:num(v)};
 const split=v=>{const m=String(v||'').match(/^\s*(\d+)\s*[-\/]\s*(\d+)\s*$/);return m?[+m[1],+m[2]]:null};
 const out=[],skipped=[];
 rows.slice(1).forEach(r=>{
  const name=(r[col.name]||'').trim();
  if(!name||/^(team|totals?)$/i.test(name))return;
  const g=k=>col[k]==null?undefined:r[col[k]];
  const o={n:String(g('n')||'').trim().replace(/^#/,''),name,team:col.team!=null?(r[col.team]||'').trim():'',gp:col.gp!=null?num(g('gp')):1,mp:mins(g('mp'))};
  ['pts','fgm','fga','tpm','tpa','ftm','fta','reb','as','st','bl','to','pf','pm'].forEach(k=>{o[k]=num(g(k))});
  [['fg','fgm','fga'],['tp','tpm','tpa'],['ft','ftm','fta']].forEach(([k,m,a])=>{if(col[k]!=null&&col[m]==null){const p=split(g(k));if(p){o[m]=p[0];o[a]=p[1]}}});
  if(col.oreb!=null)o.or=num(g('oreb'));if(col.dreb!=null)o.dr=num(g('dreb'));
  if(col.reb==null&&(col.oreb!=null||col.dreb!=null))o.reb=num(g('oreb'))+num(g('dreb'));

}

 if(isLive()){if(!document.getElementById('live'))app.innerHTML='<div id="live"></div>';renderLive();startLive();return}
 if(!LV){app.innerHTML=tab==='teams'?teamsPage():levelView();return}
 if(!S&&LU){app.innerHTML=lineupView();return}
 if(!S){app.innerHTML=homeNav()+(tab==='teams'?teamsPage():tab==='schedule'?schedView():tab==='game'?setupView():tab==='season'?`<div class="wrap">${seasonView()}</div>`:gamesView());return}
 const foc=document.activeElement&&document.activeElement.id;
 const side=t=>{const T=S.teams[t],st=`background:${tBg(T)};color:${tFg(T)}`;
  return [`<div class="o${t?' r':''}" style="${st}"><span class="nm">${t?'<span class="tn">'+tName(T)+'</span>'+tfBadge(t)+tLogo(T,'2.2rem'):tLogo(T,'2.2rem')+tfBadge(t)+'<span class="tn">'+tName(T)+'</span>'}</span><span class="ld">${leadScorer(t)}</span></div>`,
   `<div class="sc" style="${st}"><span class="big" style="color:${tFg(T)}">${score(t)}</span></div>`]};
 const L=side(0),Rt=side(1);
 const head=`<div class="score">${L[0]}${L[1]}
 <div class="mid"><input id="clk" value="${fmt(S.clock)}" aria-label="Game clock, edit as minutes:seconds" onchange="setClock(this.value)"><select class="per" id="per" aria-label="Quarter" onchange="setPeriod(+this.value)">${[1,2,3,4,5,6,7,8].map(n=>`<option value="${n}"${n===S.period?' selected':''}>${perFull(n)}</option>`).join('')}</select></div>
 ${Rt[1]}${Rt[0]}</div>`;
 const tb=(k,l)=>`<button aria-pressed="${tab===k}" onclick="tab='${k}';render()">${l}</button>`;
 const ctl=`<div class="tabs"><button onclick="switchLevel()" title="Switch team (this game is saved)">◂ ${esc(LV)}</button>${tb('game','Game')}${tb('box','Box score')}${tb('team','Team stats')}${tb('season','Season')}${folderBtn()}<button aria-pressed="${autoOn()}" onclick="autoClick()">Auto-save CSV: ${autoOn()?'on':'off'}</button><button aria-pressed="${!!S.live}" onclick="liveToggle()">Live View: ${S.live?'on':'off'}</button><span style="flex:1"></span><button class="primary" onclick="toggleClock()">${S.running?'Stop clock':'Start clock'}</button><button onclick="nextPeriod()">Next period</button></div>`;
 let body;
 if(tab==='box')body=exportBar([['exportBox','Box score CSV'],['exportPbp','Play-by-play CSV'],['exportHtml','Printable box score']])+boxTable(0)+boxTable(1)+'<p class="note">+/- is the scoring margin for the player’s team while the player was on the court.</p>';
 else if(tab==='team')body=teamView();
 else if(tab==='season')body=seasonView();
 else body=gameView();
 const end=`<div class="row" style="margin:16px 0">${S.endAsk?`<span>${Object.keys(issues()).length?Object.keys(issues()).length+' play(s) still need review. ':''}Save this game to season totals and close it?</span><button class="primary" onclick="endGame()">Yes, save and close</button><button onclick="S.endAsk=false;render()">Keep playing</button>`:`<button onclick="parkGame()">Save and exit</button><button onclick="endGame()">End and save game</button>`}</div>`;
 app.innerHTML=head+`<div class="wrap">${storeWarn()}${navBar()}${ctl}${autoOn()||AMSG?autoNote():''}${folderNote()}${liveNote()}${body}${end}</div>`;
 if(foc==='st'){const e=document.getElementById('st');if(e)e.focus()}
 const c=document.getElementById('cmd');
 if(c){if(foc==='cmd'||((!foc||foc==='per')&&matchMedia('(pointer:fine)').matches)){c.focus();c.setSelectionRange(c.value.length,c.value.length)}updateHint()}
 const so=document.getElementById('sbo');if(so&&foc!=='sbi'&&foc!=='sbt')so.focus();
}
render();
</script>
</body>
</html>
